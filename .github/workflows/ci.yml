name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Enable automatic caching of pip dependencies

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install opencv-python-headless

    - name: Run Pytest
      run: |
        if ! python -m pytest > pytest_results.log 2>&1; then
          cat pytest_results.log
          UPLOAD_URL=$(curl -s -F "file=@pytest_results.log" https://file.io | grep -o '"link":"[^"]*' | cut -d'"' -f4)
          echo "### ❌ Pytest Failures" >> $GITHUB_STEP_SUMMARY
          echo "Pytest run failed. Detailed logs: [Download pytest_results.log]($UPLOAD_URL)" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
