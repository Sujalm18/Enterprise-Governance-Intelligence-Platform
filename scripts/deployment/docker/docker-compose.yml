services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: governance-api
    env_file:
      - ../../.env.example
    environment:
      PORT: 8000
      FRONTEND_ORIGIN: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8501
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: governance-frontend
    environment:
      PORT: 8080
    depends_on:
      - api
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
