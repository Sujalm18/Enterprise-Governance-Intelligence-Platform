services:
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: governance-api
    env_file:
      - ../../.env.example
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: governance-frontend
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - api
    ports:
      - "8501:8501"
    volumes:
      - ../../data:/app/data
